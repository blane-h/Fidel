<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fidel Spell</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top-nav">
      <div class="logo" aria-label="Fidel logo">ፊደል</div>
            <nav>
        <a href="/study">Study</a>
        <a href="/" class="active">Spell</a>
        <a href="/draw">Draw</a>
        <a href="/train">Train</a>
      </nav>
    </header>

    <main class="spell-page">
      <section class="prompt-area">
        <button id="fidelToggleBtn" class="icon-btn" aria-label="Toggle translation">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
            <path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/>
          </svg>
        </button>
        <div class="prompt-copy">
          <h2 id="latinPrompt">fidel</h2>
          <p id="translationText" class="translation-text" hidden></p>
        </div>
        <button id="soundBtn" class="icon-btn" aria-label="Play pronunciation">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>
      </section>
      <section class="answer-area-with-action">
        <div class="answer-area-main">
          <div id="answerSlots" class="answer-slots"></div>
          <p id="statusMessage" class="status"></p>
        </div>
        <div class="action-buttons">
          <button id="newWordBtn" class="new-word-side-btn" type="button">New Word</button>
          <button id="revealBtn" class="reveal-btn" type="button">Reveal</button>
        </div>
      </section>
      <section class="keyboard-section">
        <div id="consonantGrid" class="consonant-grid"></div>
        <div class="vowel-row-container">
          <button id="backspaceBtn" class="action-btn" type="button" aria-label="Backspace">⌫</button>
          <div id="vowelRow" class="vowel-row"></div>
          <button id="enterBtn" class="action-btn" type="button" aria-label="Enter">↩</button>
        </div>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
