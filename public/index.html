<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fidel Spell</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top-nav">
      <div class="logo" aria-label="Fidel logo">ፊደል</div>
      <nav>
        <a href="study.html">Study</a>
        <a href="index.html">Spell</a>
        <a href="draw.html">Draw</a>
        <a href="train.html">Train</a>
      </nav>
    </header>

    <main class="spell-page">
      <section class="prompt-area">
        <button id="translateBtn" class="icon-btn translate-btn" aria-label="Show translation">🌐</button>
        <div class="prompt-copy">
          <h2 id="latinPrompt">fidel</h2>
          <p id="translationText" class="translation-text" hidden></p>
        </div>
        <button id="fidelToggleBtn" class="icon-btn" aria-label="Toggle fidel view">
          <svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor">
            <path d="M7.5 4a6.5 6.5 0 0 1 6.5 6.5c0 1.6-.6 3.1-1.5 4.3l1.4 1.4A8 8 0 0 0 15.5 4 8.5 8.5 0 1 0 7.5 17a8 8 0 0 0 1.4-2.8L6.6 14A6.5 6.5 0 0 1 7.5 4m9.5 6a6.5 6.5 0 0 1-13 0 6.5 6.5 0 0 1 13 0"/>
            <path d="M17.3 8.3l-1.4-1.4-1.4 1.4 1.4 1.4z"/>
          </svg>
        </button>
        <button id="soundBtn" class="icon-btn" aria-label="Play pronunciation">🔊</button>
      </section>
      <section class="answer-area">
        <div id="answerSlots" class="answer-slots"></div>
        <p id="statusMessage" class="status"></p>
      </section>
      <section class="keyboard-section">
        <div id="consonantGrid" class="consonant-grid"></div>
        <div class="vowel-row-container">
          <button id="backspaceBtn" class="action-btn" type="button" aria-label="Backspace">⌫</button>
          <div id="vowelRow" class="vowel-row"></div>
          <button id="enterBtn" class="action-btn" type="button" aria-label="Enter">↩</button>
        </div>
      </section>
      <section class="footer-actions">
        <button id="clearBtn" class="small-btn">Clear</button>
        <button id="newWordBtn" class="small-btn">New Word</button>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
