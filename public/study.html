<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fidel Study</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top-nav">
      <div class="logo" aria-label="Fidel logo">ፊደል</div>
      <nav>
        <a class="active" href="study.html">Study</a>
        <a href="index.html">Spell</a>
        <a href="draw.html">Draw</a>
        <a href="train.html">Train</a>
      </nav>
    </header>

    <main class="study-page">
      <section class="study-header">
        <button id="prevConsonantBtn" class="icon-btn arrow-btn" aria-label="Previous consonants">◀</button>
        <div id="consonantBoxes" class="consonant-boxes"></div>
        <button id="nextConsonantBtn" class="icon-btn arrow-btn" aria-label="Next consonants">▶</button>
      </section>

      <section class="study-controls">
        <button id="cycleBtn" class="icon-btn control-btn" aria-label="Cycle">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
            <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
          </svg>
        </button>
        <button id="flipBtn" class="icon-btn control-btn" aria-label="Flip card">
          <img src="/flip-icon.png" alt="Flip" width="28" height="28" />
        </button>
        <button id="soundBtn" class="icon-btn control-btn" aria-label="Play pronunciation">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>
        <button id="shuffleBtn" class="icon-btn control-btn" aria-label="Shuffle cards">
          <img src="/shuffle-icon.png" alt="Shuffle" width="28" height="28" />
        </button>
      </section>

      <section class="card-section">
        <button id="backBtn" class="icon-btn arrow-btn canvas-arrow" aria-label="Back">◀</button>
        <div id="flashcard" class="flashcard">
          <div class="flashcard-inner" id="flashcardInner">
            <div class="flashcard-front">
              <span id="frontText" class="card-text">-</span>
            </div>
            <div class="flashcard-back">
              <span id="backText" class="card-text">-</span>
            </div>
          </div>
        </div>
        <button id="nextBtn" class="icon-btn arrow-btn canvas-arrow" aria-label="Next">▶</button>
      </section>

      <div id="familyCompleteOverlay" class="family-complete-overlay" hidden>
        <div class="family-complete-card">
          <button id="closeFamilyCompleteBtn" class="family-complete-close" aria-label="Close">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
              <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
          </button>
          <p id="familyCompleteMessage" class="family-complete-message">Finished with U consonant family, click to continue or to study this family again!</p>
          <div class="family-complete-actions">
            <button id="nextFamilyBtn" class="family-complete-action" aria-label="Next family">
              <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
              </svg>
              <span>Next</span>
            </button>
            <button id="restartFamilyBtn" class="family-complete-action" aria-label="Restart family">
              <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
              </svg>
              <span>Restart</span>
            </button>
          </div>
        </div>
      </div>
    </main>

    <script src="/features.js" defer></script>
    <script src="/study.js" defer></script>
  </body>
</html>
