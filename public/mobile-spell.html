<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fidel Spell</title>
  <link rel="stylesheet" href="/mobile-styles.css?v=35" />
</head>
<body>
  <header class="mobile-top-nav">
    <a href="/" class="mobile-logo" aria-label="Fidel home">ፊደል</a>
    <h1 class="mobile-title">Spell</h1>
    <button id="mobileHamburger" class="mobile-hamburger" aria-label="Open navigation" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
      </svg>
    </button>
  </header>

  <div id="mobileNavDrawer" class="mobile-nav-drawer" aria-hidden="true">
    <div class="mobile-nav-backdrop"></div>
    <nav class="mobile-nav-panel">
      <button id="mobileNavClose" class="mobile-nav-close" aria-label="Close navigation">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
      <ul class="mobile-nav-links">
        <li><a href="/study" class="mobile-nav-link">Study</a></li>
        <li><a href="/" class="mobile-nav-link active">Spell</a></li>
        <li><a href="/draw" class="mobile-nav-link">Draw</a></li>
      </ul>
    </nav>
  </div>

  <main class="mobile-page">
    <section class="mobile-content">
      <div class="mobile-word-meta">
        <button id="mobileFidelToggleBtn" class="mobile-icon-btn" aria-label="Toggle translation">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v2h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z"/>
          </svg>
        </button>
        <button id="mobileSoundBtn" class="mobile-icon-btn" aria-label="Play pronunciation">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>
        <p id="mobileTranslationText" class="mobile-prompt hint" hidden></p>
      </div>

      <section class="mobile-controls-row">
        <h2 id="mobileLatinPrompt" class="mobile-prompt">fidel</h2>
      </section>

      <div id="slotsArea" class="mobile-slots-area">
        <div id="mobileAnswerRows" class="mobile-answer-rows"></div>
        <p id="mobileStatusMessage" class="mobile-status"></p>
      </div>

      <div class="mobile-keyboard-wrapper">
        <div class="mobile-action-buttons">
          <button id="mobileNewWordBtn" class="mobile-small-btn spell-buttons" type="button">New Word</button>
          <button id="mobileRevealBtn" class="mobile-small-btn spell-buttons" type="button">Reveal</button>
        </div>
        <section class="mobile-keyboard-section">
          <div id="mobileConsonantGrid" class="mobile-keyboard-grid"></div>
        <div class="mobile-keyboard-actions">
          <div id="mobileVowelRow" class="mobile-keyboard-vowel-slot"></div>
        </div>
        <button id="mobileEnterBtn" class="mobile-keyboard-action mobile-keyboard-enter" type="button" aria-label="Enter">Enter</button>
        </section>
      </div>
    </section>
  </main>

  <script src="/mobile-common.js" defer></script>
  <script src="/mobile-app.js" defer></script>
</body>
</html>
