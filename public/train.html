<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fidel Train</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top-nav">
      <div class="logo" aria-label="Fidel logo">ፊደል</div>
      <nav>
        <a href="/study">Study</a>
        <a href="/">Spell</a>
        <a href="/draw">Draw</a>
        <a href="/train" class="active">Train</a>
      </nav>
    </header>

    <main class="train-page">
      <section class="train-controls">
        <div class="mode-toggle">
          <button id="drawModeBtn" class="tool-btn active" type="button">Draw</button>
          <button id="autoModeBtn" class="tool-btn" type="button">Auto</button>
        </div>

        <div id="batchRow" class="batch-row" hidden>
          <label for="batchSize">Batch size</label>
          <select id="batchSize">
            <option value="10">10</option>
            <option value="25">25</option>
            <option value="50" selected>50</option>
          </select>
          <button id="generateBtn" class="tool-btn primary" type="button">Generate batch</button>
        </div>
      </section>

        <!-- Draw mode -->
        <section id="drawMode" class="train-draw">
          <section class="draw-controls">
            <div class="draw-center-row">
              <button id="traceBtn" class="icon-btn control-btn draw-controls-icon" aria-label="Toggle trace mode">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                  <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                </svg>
              </button>
              <h2 id="drawPrompt">fidel</h2>
              <button id="soundBtn" class="icon-btn control-btn draw-controls-icon" aria-label="Play pronunciation">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
                  <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
              </button>
            </div>
          </section>

        <section class="canvas-section">
          <div class="drawing-frame">
            <div id="traceLayer" class="trace-layer" hidden></div>
            <canvas id="drawCanvas" width="420" height="420"></canvas>
          </div>
          <div class="reference-frame">
            <canvas id="referenceCanvas" width="140" height="140"></canvas>
            <p class="reference-label">Reference</p>
          </div>
        </section>

        <p id="statusMessage" class="status"></p>

        <section class="study-tools">
          <button id="clearBtn" class="tool-btn" aria-label="Clear drawing">Clear</button>
          <button id="correctBtn" class="tool-btn success" aria-label="Mark correct">✓ Correct</button>
          <button id="incorrectBtn" class="tool-btn danger" aria-label="Mark incorrect">✗ Incorrect</button>
          <button id="skipBtn" class="tool-btn" aria-label="Skip">Skip</button>
        </section>
      </section>

      <!-- Auto mode -->
      <section id="autoMode" class="train-auto" hidden>
        <div class="auto-header">
          <p class="auto-hint">
            Generated drawings shown below. Confirm or flip the suggested label, then
            click <strong>Save</strong> to submit the batch. <strong>Skip</strong> drops it.
          </p>
        </div>
        <div id="autoGrid" class="auto-grid"></div>
        <div class="auto-actions">
          <button id="saveAutoBtn" class="tool-btn primary" type="button" disabled>Save batch</button>
          <button id="cancelAutoBtn" class="tool-btn" type="button">Cancel</button>
        </div>
      </section>
    </main>

    <script src="/features.js" defer></script>
    <script src="/train.js" defer></script>
  </body>
</html>
