<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fidel Study</title>
  <link rel="stylesheet" href="mobile-styles.css" />
</head>
<body>
  <header class="mobile-top-nav">
    <a href="." class="mobile-logo" aria-label="Fidel home">ፊደል</a>
    <h1 class="mobile-title">Study</h1>
  </header>

  <main class="mobile-page">
    <section class="mobile-consonant-section">
      <div class="consonant-scroll-wrapper">
        <div id="consonantBoxes" class="consonant-boxes"></div>
      </div>
      <div id="consonantScrollbar" class="consonant-scrollbar">
        <div id="consonantScrollbarThumb" class="consonant-scrollbar-thumb"></div>
      </div>
    </section>

    <section class="mobile-controls-row">
      <button id="mobileCycleBtn" class="mobile-icon-btn" aria-label="Cycle">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
        </svg>
      </button>
      <button id="mobileFlipBtn" class="mobile-icon-btn" aria-label="Flip card">
        <img src="flip-icon.png" alt="Flip" width="24" height="24" />
      </button>
      <button id="mobileSoundBtn" class="mobile-icon-btn" aria-label="Play pronunciation">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
      </button>
      <button id="mobileShuffleBtn" class="mobile-icon-btn" aria-label="Shuffle">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
        </svg>
      </button>
    </section>

    <section class="mobile-card-area">
      <div id="mobileFlashcard" class="mobile-card">
        <div class="mobile-card-inner" id="mobileFlashcardInner">
          <div class="mobile-card-face">
            <span id="mobileFrontText" class="mobile-card-text">-</span>
          </div>
          <div class="mobile-card-face mobile-card-back">
            <span id="mobileBackText" class="mobile-card-text">-</span>
          </div>
        </div>
      </div>
    </section>

    <section class="mobile-bottom-nav">
      <button id="mobilePrevVowelBtn" class="mobile-bottom-btn" aria-label="Previous vowel">◀</button>
      <button id="mobileNextVowelBtn" class="mobile-bottom-btn" aria-label="Next vowel">▶</button>
    </section>

    <div id="mobileFamilyCompleteOverlay" class="mobile-overlay" hidden>
      <div class="mobile-overlay-card">
        <button id="mobileCloseFamilyCompleteBtn" class="mobile-overlay-close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
        <p id="mobileFamilyCompleteMessage" class="mobile-overlay-message">Finished with U consonant family, click to continue or to study this family again!</p>
        <div class="mobile-overlay-actions">
          <button id="mobileNextFamilyBtn" class="mobile-overlay-action" aria-label="Next family">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
            </svg>
            <span>Next</span>
          </button>
          <button id="mobileRestartFamilyBtn" class="mobile-overlay-action" aria-label="Restart family">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
            </svg>
            <span>Restart</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <div class="mobile-bottom-tab-bar">
    <a href="study" class="mobile-tab-btn active">Study</a>
    <a href="." class="mobile-tab-btn">Spell</a>
    <a href="draw" class="mobile-tab-btn">Draw</a>
  </div>

  <script src="base.js" defer></script>
  <script src="mobile-common.js" defer></script>
  <script src="mobile-study.js" defer></script>
</body>
</html>
